plugins { id 'com.android.application' }

def rupeeRizzUrl = project.findProperty('rupeeRizzUrl') ?: 'https://REPLACE_WITH_YOUR_DEPLOYED_RUPEERIZZ_DOMAIN'

android {
    namespace 'com.rupeerizz.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.rupeerizz.app'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'RUPEE_RIZZ_URL', '"' + rupeeRizzUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
